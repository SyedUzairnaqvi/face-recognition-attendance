<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Vision Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#18212f}
.wrap{max-width:1200px;margin:auto;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{margin:0 0 5px}.muted{color:#667085}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.value{font-size:30px;font-weight:700;margin-top:8px}.label{color:#667085;font-size:13px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.chart{height:300px}.wide{margin-top:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{color:#667085}
.status{padding:8px 12px;border-radius:9px;background:#eaf7ed;color:#247a36}
.error{padding:12px;border-radius:9px;background:#fff0f0;color:#b42318;margin-bottom:16px}
.loading{padding:12px;border-radius:9px;background:#eef4ff;color:#175cd3;margin-bottom:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.top{display:block}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <div><h1>Secure Vision Analytics</h1><div class="muted">Live attendance and recognition analytics</div></div>
  <span id="status" class="status">Connecting...</span>
</div>
<div id="error"></div>
<div class="grid">
<div class="card"><div class="label">Registered People</div><div id="people" class="value">—</div></div>
<div class="card"><div class="label">Attendance Records</div><div id="attendance" class="value">—</div></div>
<div class="card"><div class="label">Recognition Events</div><div id="events" class="value">—</div></div>
<div class="card"><div class="label">Recognition Rate</div><div id="rate" class="value">—</div></div>
</div>
<div class="charts">
<div class="card"><h2>Daily Attendance</h2><div class="chart"><canvas id="daily"></canvas></div></div>
<div class="card"><h2>Recognition by Source</h2><div class="chart"><canvas id="source"></canvas></div></div>
</div>
<div class="card wide"><h2>Person Attendance</h2><div id="peopleTable"><p class="muted">Loading...</p></div></div>
<div class="card wide"><h2>Video Analytics</h2><div id="video"><p class="muted">Loading...</p></div></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const requestedApi=params.get('api');

// The analytics page may be hosted separately from FastAPI. Try the current
// origin first, then the known Render API. A URL passed with ?api=... wins.
const candidates=[];
if(requestedApi) candidates.push(requestedApi.replace(/\/$/,''));
if(location.protocol.startsWith('http')) candidates.push(location.origin);
candidates.push('https://secure-vision-attendance.onrender.com');
candidates.push('https://secure-vision-attendance-1.onrender.com');

const uniqueApis=[...new Set(candidates)];
const $=id=>document.getElementById(id);
let c1,c2;

function escapeHtml(value){
  return String(value ?? '—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}
function table(headers,rows){
  if(!rows.length)return '<p class="muted">No data available.</p>';
  return '<table><thead><tr>'+headers.map(x=>`<th>${escapeHtml(x)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${escapeHtml(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}

async function fetchAnalytics(){
  let lastError=null;
  for(const api of uniqueApis){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),12000);
    try{
      const url=api+'/analytics/dashboard';
      const r=await fetch(url,{cache:'no-store',signal:controller.signal,headers:{'Accept':'application/json'}});
      const contentType=r.headers.get('content-type')||'';
      if(!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      if(!contentType.includes('application/json')) throw new Error('Server returned a non-JSON response');
      const d=await r.json();
      return {api,d};
    }catch(e){
      lastError=new Error(`${api}: ${e.name==='AbortError'?'request timed out':e.message}`);
    }finally{
      clearTimeout(timer);
    }
  }
  throw lastError||new Error('No analytics API endpoint is available');
}

function render(d,api){
  $('people').textContent=d.registered_people??0;
  $('attendance').textContent=d.attendance_records??0;
  $('events').textContent=d.recognition_events??0;
  $('rate').textContent=(d.recognition_rate??0)+'%';
  $('status').textContent=d.database_connected?'MySQL connected':'API connected';
  $('status').className='status';
  $('error').innerHTML='';

  $('peopleTable').innerHTML=table(['Name','Attendance Days','Last Attendance'],(d.person_attendance||[]).map(x=>[x.name,x.attendance_count,x.last_attendance]));
  const v=d.video_analytics||{};
  $('video').innerHTML=table(['Videos','Faces Detected','Recognized','Unknown'],[[v.total_videos||0,v.total_faces_detected||0,v.total_recognized_faces||0,v.total_unknown_faces||0]]);

  if(c1)c1.destroy();
  if(c2)c2.destroy();
  if(typeof Chart==='undefined') throw new Error('Chart library failed to load');

  c1=new Chart($('daily'),{
    type:'bar',
    data:{labels:(d.daily_attendance||[]).map(x=>x.date),datasets:[
      {label:'People Present',data:(d.daily_attendance||[]).map(x=>x.people_present)},
      {label:'Attendance Records',data:(d.daily_attendance||[]).map(x=>x.attendance_records)}
    ]},
    options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
  });

  c2=new Chart($('source'),{
    type:'bar',
    data:{labels:(d.recognition_by_source||[]).map(x=>x.source),datasets:[
      {label:'Matched',data:(d.recognition_by_source||[]).map(x=>x.matched_events)},
      {label:'Unknown',data:(d.recognition_by_source||[]).map(x=>x.unknown_events)}
    ]},
    options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
  });
}

async function load(){
  $('status').textContent='Connecting...';
  $('status').className='status';
  $('error').innerHTML='<div class="loading">Connecting to the analytics API and MySQL...</div>';
  try{
    const result=await fetchAnalytics();
    render(result.d,result.api);
  }catch(e){
    $('status').textContent='Offline';
    $('status').className='status';
    $('error').innerHTML='<div class="error"><strong>Analytics connection failed.</strong><br>'+escapeHtml(e.message)+'<br><br>Check that the FastAPI Render service is running. You can also open this page with <code>?api=https://your-api-service.onrender.com</code>.</div>';
    $('peopleTable').innerHTML='<p class="muted">Analytics unavailable.</p>';
    $('video').innerHTML='<p class="muted">Analytics unavailable.</p>';
  }
}

load();
setInterval(load,30000);
</script>
</body>
</html>
