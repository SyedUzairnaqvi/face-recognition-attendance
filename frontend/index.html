<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Vision Attendance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <p class="eyebrow">SECURE VISION</p>

                <h1>Attendance Console</h1>

                <p class="subtitle">
                    Face verification, quality checks, and duplicate-safe attendance.
                </p>
            </div>

            <div id="api-status" class="status-pill">
                Checking API...
            </div>
        </header>


        <div class="grid">

            <!-- VERIFY CARD -->
            <section class="card">

                <div class="card-header">
                    <div>
                        <h2>Verify Attendance</h2>

                        <p>
                            Upload a clear face image to verify identity.
                        </p>
                    </div>
                </div>


                <!-- File upload -->
                <label class="dropzone" for="image-input">

                    <input
                        id="image-input"
                        type="file"
                        accept="image/*"
                    >

                    <span class="drop-title">
                        Choose an image
                    </span>

                    <span id="file-name" class="drop-subtitle">
                        PNG, JPG, JPEG, WEBP
                    </span>

                </label>


                <!-- Verify button -->
                <button
                    id="verify-btn"
                    class="primary-btn"
                    disabled
                >
                    Verify & Mark Attendance
                </button>


                <!-- Result -->
                <div
                    id="result"
                    class="result hidden"
                ></div>

            </section>


            <!-- ATTENDANCE CARD -->
            <section class="card">

                <div class="card-header">

                    <div>
                        <h2>Today's Attendance</h2>

                        <p>
                            Attendance recorded by the API.
                        </p>
                    </div>

                    <button
                        id="refresh-btn"
                        class="secondary-btn"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="attendance"
                    class="table-wrap"
                >
                    <div class="empty">
                        Loading attendance...
                    </div>
                </div>

            </section>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
